<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="description" content="Rijken der Eeuwen: een beurtgebaseerd strategiespel. Sticht steden, onderzoek technologie en bouw een rijk.">
<title>Rijken der Eeuwen</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--wood:#3a2716;--wood2:#22160b;--parch:#efe3c2;--parch2:#ddcb9c;--ink:#2b1d10;--muted:#6f5a3e;--gold:#e3b650;--red:#8c2a1e;--green:#46682f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--wood2);color:var(--ink);font-family:'Alegreya Sans',system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:6px 8px;background:linear-gradient(#4d341d,#2a1b0d);color:var(--parch);border-bottom:2px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:1}
#cflag{width:24px;height:16px;border:1.5px solid var(--gold);flex:none}
#cname{font-family:Cinzel,serif;font-weight:700;font-size:15px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#year{font-family:Cinzel,serif;font-size:13px;white-space:nowrap}
.stat{font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
#hstats{margin-left:auto;display:flex;gap:10px}
#menuBtn{background:linear-gradient(#5a3e22,#2e1e0f);color:var(--gold);border:1px solid var(--gold);width:32px;height:30px;font-size:16px}
#mapwrap{position:relative;flex:1 1 auto;min-height:220px;overflow:hidden;background:#0c0906}
canvas{display:block;touch-action:none}
#zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
#zoom button{width:34px;height:34px;background:linear-gradient(#f3e8c9,#d8c48f);border:1.5px solid var(--wood);font:700 18px 'Alegreya Sans',sans-serif;color:var(--ink);padding:0;box-shadow:0 2px 4px rgba(0,0,0,.5)}
#turnbar{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
#turnbar button{font:700 15px 'Alegreya Sans',sans-serif;padding:9px 12px;border:1.5px solid var(--wood);box-shadow:0 2px 6px rgba(0,0,0,.6)}
#nextBtn{background:linear-gradient(#f3e8c9,#d8c48f);color:var(--ink)}
#endBtn{background:linear-gradient(#f0c75e,#b98a26);color:#2a1a05}
#endBtn.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(240,199,94,.55),0 2px 6px rgba(0,0,0,.6)}}
#ticker{position:absolute;left:8px;bottom:12px;right:200px;font-size:13px;color:var(--parch);pointer-events:none;text-shadow:0 1px 2px #000,0 0 4px #000}
#tabs{display:flex;background:var(--wood);border-top:2px solid var(--gold);overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:1 0 auto;background:none;border:none;padding:9px 10px;font:700 15px 'Alegreya Sans',sans-serif;color:#cdb98a}
#tabs button.on{background:var(--parch);color:var(--ink)}
#panel{height:34vh;overflow-y:auto;background:var(--parch);padding:10px 12px 18px;font-size:15px;line-height:1.35;background-image:radial-gradient(rgba(120,90,40,.08) 1px,transparent 1px);background-size:5px 5px}
#panel h3{font-family:Cinzel,serif;font-size:16px;margin:8px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--parch2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--parch2)}
.row:last-child{border-bottom:none}
.grow{flex:1;min-width:0}
.hint{color:var(--muted);font-size:14px;margin:3px 0}
.btns{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
button.act{background:linear-gradient(#5a3e22,#3a2614);color:var(--parch);border:1px solid #2a1a0c;padding:7px 11px;font:700 14px 'Alegreya Sans',sans-serif;white-space:nowrap}
button.act.alt{background:transparent;color:var(--ink);border:1.5px solid var(--wood)}
button.act.war{background:linear-gradient(#a8382a,#6d1d14)}
button.act.gold{background:linear-gradient(#f0c75e,#b98a26);color:#2a1a05}
button.act.on{background:linear-gradient(#5f8a46,#3a5a29)}
button.act:disabled{opacity:.35}
.bar{height:7px;background:var(--parch2);margin-top:4px;border:1px solid #b9a575}
.bar i{display:block;height:100%;background:linear-gradient(#7a5326,#4c3216)}
.bar.f i{background:linear-gradient(#7da54a,#4e7a2a)}
.sw{display:inline-block;width:13px;height:10px;margin-right:6px;border:1px solid var(--ink);vertical-align:0}
.tag{font-size:13px;padding:0 6px;border:1px solid currentColor;margin-left:6px}
.tag.war{color:#a8382a}.tag.peace{color:#46682f}
.ucard{display:flex;gap:10px;align-items:center}
.ucard .em{font-size:30px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid var(--ink)}
.yld{font-variant-numeric:tabular-nums;white-space:nowrap}
#overlay{position:fixed;inset:0;background:rgba(15,10,5,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#overlay.hide{display:none}
.card{background:var(--parch);border:3px double var(--wood);box-shadow:0 12px 40px rgba(0,0,0,.7);max-width:440px;width:100%;padding:20px 18px;max-height:92vh;overflow:auto}
.card h1{font-family:Cinzel,serif;font-size:34px;line-height:1.05;margin:0 0 6px;color:var(--wood)}
.card p{margin:0 0 12px}
.card .act{margin:0 6px 8px 0}
.pick{display:flex;align-items:center;width:100%;gap:10px;padding:9px 10px;margin:0 0 6px;background:var(--parch2);border:1px solid #b9a575;text-align:left;font:15px 'Alegreya Sans',sans-serif;color:var(--ink)}
.pick .sw{width:26px;height:18px;flex:none}
.pick b{font-family:Cinzel,serif;font-size:17px;display:block}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--parch);color:var(--ink);padding:8px 14px;font-size:15px;max-width:90vw;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6;border:1.5px solid var(--wood);border-left:5px solid var(--red);box-shadow:0 4px 14px rgba(0,0,0,.6)}
#toast.show{opacity:1}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}#endBtn.pulse{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header><div id="cflag"></div><div id="cname">Rijken der Eeuwen</div><div id="year"></div>
    <div id="hstats"><span class="stat" id="gold"></span><span class="stat" id="sci"></span></div>
    <button id="menuBtn" aria-label="Menu">☰</button></header>
  <div id="mapwrap"><canvas id="map"></canvas>
    <div id="zoom"><button data-z="in" aria-label="Inzoomen">+</button><button data-z="out" aria-label="Uitzoomen">−</button><button data-z="home" aria-label="Naar geselecteerde eenheid">⌖</button></div>
    <div id="ticker"></div>
    <div id="turnbar"><button id="nextBtn">Volgende</button><button id="endBtn">Einde beurt</button></div>
  </div>
  <nav id="tabs"><button data-t="info" class="on">Eenheid</button><button data-t="stad">Stad</button><button data-t="onderzoek">Onderzoek</button><button data-t="rijk">Rijk</button><button data-t="diplo">Diplomatie</button></nav>
  <section id="panel"></section>
</div>
<div id="overlay"></div>
<div id="toast"></div>
<script>

/* ================= gegevens ================= */
const TER={
 oceaan:{n:'Oceaan',f:1,s:0,c:2,col:'#1e4d73',w:1},

 heuvels:{n:'Heuvels',f:1,s:0,c:0,col:'#9a8f4f',mc:2,def:.5,irr:1,mine:2},

const RES={tarwe:{n:'Tarwe',e:'🌾',f:2,on:['gras','vlakte']},vis:{n:'Vis',e:'🐟',f:2,on:['kust']},goud:{n:'Goud',e:'💰',c:4,on:['heuvels','bergen']},wild:{n:'Wild',e:'🦌',f:1,s:1,on:['bos','toendra']},paard:{n:'Paarden',e:'🐎',s:1,c:1,on:['vlakte','gras']},wijn:{n:'Wijn',e:'🍇',c:3,on:['heuvels']}};
const UT={
 kolonist:{n:'Kolonist',e:'⛺',a:0,d:1,m:1,c:30,settle:1,civil:1},
 arbeider:{n:'Arbeider',e:'⚒️',a:0,d:0,m:1,c:20,work:1,civil:1},
 verkenner:{n:'Verkenner',e:'🧭',a:0,d:0,m:2,c:20,civil:1,sight:2},
 krijger:{n:'Krijger',e:'🪓',a:1,d:1,m:1,c:10},
 speerman:{n:'Speerman',e:'🔱',a:1,d:2,m:1,c:20,t:'brons'},

 pikenier:{n:'Pikenier',e:'🛡️',a:1,d:3,m:1,c:30,t:'feodalisme'},
 ridder:{n:'Ridder',e:'🏇',a:4,d:3,m:2,c:40,t:'ridderschap'},
 musketier:{n:'Musketier',e:'💂',a:2,d:4,m:1,c:30,t:'buskruit'},
 kanon:{n:'Kanon',e:'💣',a:8,d:1,m:1,c:40,t:'metallurgie'},
 cavalerie:{n:'Cavalerie',e:'🐴',a:6,d:3,m:3,c:60,t:'industrie'},
 galei:{n:'Galei',e:'⛵',a:1,d:1,m:3,c:30,t:'zeevaart',sea:1,cap:2},
 karveel:{n:'Karveel',e:'🚢',a:1,d:2,m:4,c:40,t:'navigatie',sea:1,cap:3},
 fregat:{n:'Fregat',e:'⚓',a:4,d:2,m:5,c:60,t:'stoom',sea:1,cap:2},
};
const BT={
 graanschuur:{n:'Graanschuur',c:60,up:1,t:'aardewerk',d:'Behoudt de helft van het voedsel bij groei'},
 kazerne:{n:'Kazerne',c:40,up:1,d:'Nieuwe eenheden zijn veteraan en herstellen sneller'},
 tempel:{n:'Tempel',c:40,up:1,t:'ceremonie',cu:1,d:'+2 tevreden burgers, +1 cultuur'},
 bibliotheek:{n:'Bibliotheek',c:90,up:1,t:'schrift',cu:3,d:'+50% wetenschap, +3 cultuur'},
 markt:{n:'Marktplaats',c:80,up:1,t:'munten',d:'+50% goud, +1 tevreden'},
 muren:{n:'Stadsmuren',c:60,up:0,t:'metselen',d:'+100% verdediging tegen landaanvallen'},
 haven:{n:'Haven',c:60,up:1,t:'zeevaart',coast:1,d:'+1 voedsel op watertegels'},
 aquaduct:{n:'Aquaduct',c:100,up:1,t:'bouwkunde',d:'Stad kan groeien voorbij 8 inwoners'},
 kathedraal:{n:'Kathedraal',c:120,up:2,t:'theologie',cu:2,d:'+3 tevreden burgers, +2 cultuur'},
 universiteit:{n:'Universiteit',c:160,up:2,t:'universiteit',cu:2,d:'+50% wetenschap, +2 cultuur'},
 bank:{n:'Bank',c:120,up:2,t:'bankwezen',d:'+50% goud'},
};
const WT={
 reus:{n:'Havenreus',c:200,t:'brons',d:'+1 handel op watertegels van deze stad'},
 tuinen:{n:'Tuinen van Ishara',c:250,t:'aardewerk',d:'+1 tevreden in al je steden'},
 wachtmuur:{n:'De Wachtmuur',c:250,t:'metselen',d:'Werkt als stadsmuren in al je steden'},
 academie:{n:'Academie der Wijzen',c:300,t:'filosofie',d:'Geeft direct een gratis technologie'},
 sterrenwacht:{n:'Sterrenwacht',c:300,t:'astronomie',d:'+100% wetenschap in deze stad'},
 expo:{n:'Wereldtentoonstelling',c:600,t:'industrie',d:'Wie dit wonder voltooit, wint het spel'},
};
const TT={
 aardewerk:{n:'Aardewerk',r:[]},brons:{n:'Bronsbewerking',r:[]},alfabet:{n:'Alfabet',r:[]},ceremonie:{n:'Ceremonieel',r:[]},
 paard:{n:'Paardrijden',r:[]},krijgscode:{n:'Krijgscode',r:[]},metselen:{n:'Metselwerk',r:[]},
 schrift:{n:'Schrift',r:['alfabet']},ijzer:{n:'IJzerbewerking',r:['brons']},munten:{n:'Muntslag',r:['brons','alfabet']},
 wiskunde:{n:'Wiskunde',r:['alfabet','metselen']},zeevaart:{n:'Zeevaart',r:['aardewerk','alfabet']},
 filosofie:{n:'Filosofie',r:['schrift','ceremonie']},bouwkunde:{n:'Bouwkunde',r:['wiskunde']},
 feodalisme:{n:'Feodalisme',r:['ijzer','ceremonie']},astronomie:{n:'Astronomie',r:['wiskunde','schrift']},
 ridderschap:{n:'Ridderschap',r:['paard','feodalisme']},theologie:{n:'Theologie',r:['filosofie','feodalisme']},
 universiteit:{n:'Universiteit',r:['astronomie','filosofie']},navigatie:{n:'Navigatie',r:['zeevaart','astronomie']},
 bankwezen:{n:'Bankwezen',r:['munten','theologie']},buskruit:{n:'Buskruit',r:['ijzer','universiteit']},
 metallurgie:{n:'Metallurgie',r:['buskruit','bouwkunde']},methode:{n:'Wetenschappelijke methode',r:['universiteit','navigatie']},
 stoom:{n:'Stoomkracht',r:['methode','metallurgie']},industrie:{n:'Industrialisatie',r:['stoom','bankwezen']},
};
const CIVS=[
 {name:'Aurelië',color:'#c8442f',cities:['Aurum','Solvane','Tirasa','Mederon','Calvia','Brenna','Ostavo','Lucerna','Pavenna','Rhenis','Vestra','Corvin','Albara','Lumeno','Sirmia']},
 {name:'Noordmarken',color:'#3b6fb6',cities:['Hjalmstad','Varnholm','Eskeby','Tromvik','Kaldby','Ravnsund','Ulfborg','Sterhavn','Gunnvik','Askeby','Fjellby','Brimvik','Isholm','Vinterby','Snarvik']},
 {name:'Karthos',color:'#d6a21e',cities:['Karthos','Melqara','Tyrsa','Byrsa','Hadrum','Utiqa','Zamar','Sidra','Kerkona','Lepta','Oeza','Thapsa','Gadra','Lixa','Motya']},
 {name:'Elmerijk',color:'#3f8f3c',cities:['Elmburg','Groenhof','Lindeveld','Eikenrode','Wilgendaal','Berkhout','Esdonk','Hazelaar','Iependam','Popelaar','Vlierhof','Taxandria','Beukeren','Varenburg','Mosrode']},
 {name:'Sulani',color:'#8b4fa3',cities:['Sulan','Amarra','Kesh','Natari','Ombu','Zuri','Taleh','Imani','Ruvan','Mbeku','Sefra','Okoyo','Daraji','Lumbi','Kisaro']},
 {name:'Tharros',color:'#2a9a98',cities:['Tharros','Ilyon','Kalydon','Pharsa','Delma','Myra','Orchos','Lykia','Eresos','Thera','Naxa','Pella','Kymos','Seriph','Antara']},
];
const SIZES={klein:{w:28,h:22,n:4,label:'Klein'},groot:{w:40,h:32,n:6,label:'Groot'}};
const TW=64,TH=32,SAVEKEY='rijken-der-eeuwen:save';
/* ================= basis ================= */
let G=null,OCC=new Map(),V={z:1,x:0,y:0},L={},tab='info',viewCity=null,infoTile=null,mapSize='klein';
const $=s=>document.querySelector(s);
const rf=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rf(a,b+1)),pick=a=>a[ri(0,a.length-1)];
const X=i=>i%G.w,Y=i=>(i/G.w)|0,idx=(x,y)=>y*G.w+x,inb=(x,y)=>x>=0&&y>=0&&x<G.w&&y<G.h;
const T=i=>G.tiles[i];
const cheb=(a,b)=>Math.max(Math.abs(X(a)-X(b)),Math.abs(Y(a)-Y(b)));
let NB8=[],NB4=[];
function buildNB(){NB8=[];NB4=[];for(let i=0;i<G.w*G.h;i++){const x=X(i),y=Y(i),a=[],b=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;if(inb(x+dx,y+dy)){a.push(idx(x+dx,y+dy));if(!dx||!dy)b.push(idx(x+dx,y+dy))}}NB8.push(a);NB4.push(b)}}
function area(i,r,fat){const o=[],x=X(i),y=Y(i);for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(fat&&r>=2&&Math.abs(dx)===r&&Math.abs(dy)===r)continue;if(inb(x+dx,y+dy))o.push(idx(x+dx,y+dy))}return o}
const isW=i=>!!TER[T(i).t].w;
function hash(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

/* bezetting */
function rebuildOcc(){OCC=new Map();for(const u of G.units){if(!OCC.has(u.i))OCC.set(u.i,[]);OCC.get(u.i).push(u)}}
const at=i=>OCC.get(i)||[];
function occAdd(u){if(!OCC.has(u.i))OCC.set(u.i,[]);OCC.get(u.i).push(u)}
function occDel(u){const a=OCC.get(u.i);if(!a)return;const k=a.indexOf(u);if(k>=0)a.splice(k,1);if(!a.length)OCC.delete(u.i)}
const cityById=id=>G.cities.find(c=>c.id===id);
const cityAt=i=>T(i).city>=0?cityById(T(i).city):null;
const has=(c,b)=>c.bld.includes(b);
const civCities=id=>G.cities.filter(c=>c.civ===id);
const knows=(civ,t)=>!t||civ.techs.includes(t);
const isMil=u=>!UT[u.type].civil&&!UT[u.type].sea;
const atWar=(a,b)=>a!==b&&G.rel[a][b]==='war';
const maxHp=u=>u.vet?4:3;
const wonderOwner=k=>G.wonders[k]!=null?G.wonders[k]:-1;
const civHasWonder=(id,k)=>{const c=G.wonders[k];return c!=null&&cityById(c)&&cityById(c).civ===id};
const cityHasWonder=(c,k)=>G.wonders[k]===c.id;

/* ================= kaartgeneratie ================= */
function noise(w,h,sc){const gw=Math.ceil(w/sc)+2,gh=Math.ceil(h/sc)+2,g=[];for(let i=0;i<gw*gh;i++)g.push(Math.random());const o=new Float32Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const fx=x/sc,fy=y/sc,x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
    const a=g[y0*gw+x0],b=g[y0*gw+x0+1],c=g[(y0+1)*gw+x0],d=g[(y0+1)*gw+x0+1];o[y*w+x]=a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}return o}
function genMap(w,h){
  const e1=noise(w,h,7),e2=noise(w,h,3),mo=noise(w,h,5),N=w*h,el=new Float32Array(N);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,nx=x/(w-1)*2-1,ny=y/(h-1)*2-1,f=Math.max(Math.abs(nx),Math.abs(ny));el[i]=e1[i]*.7+e2[i]*.3-Math.pow(f,3)*.6}
  const th=[...el].sort((a,b)=>a-b)[Math.floor(N*.55)];
  const landV=[...el].filter(v=>v>th).sort((a,b)=>a-b),qM=landV[Math.floor(landV.length*.93)],qH=landV[Math.floor(landV.length*.8)];
  G.tiles=[];
  for(let i=0;i<N;i++){const y=(i/w)|0,lat=Math.abs(y/(h-1)*2-1),m=mo[i];let t;
    if(el[i]<=th)t='oceaan';else if(el[i]>=qM)t='bergen';else if(el[i]>=qH)t='heuvels';
    else if(lat>.8)t=m>.6?'bos':'toendra';else if(lat<.5&&m<.32)t='woestijn';else if(m>.62)t='bos';else if(m>.4)t='gras';else t='vlakte';
    G.tiles.push({t,res:null,river:false,road:false,irr:false,mine:false,owner:-1,city:-1,job:null,el:el[i]})}
  buildNB();
  for(let i=0;i<N;i++)if(T(i).t==='oceaan'&&NB8[i].some(j=>!isW(j)))T(i).t='kust';
  const srcs=G.tiles.map((t,i)=>i).filter(i=>T(i).t==='heuvels'||T(i).t==='bergen');
  for(let k=0;k<Math.round(N/80)&&srcs.length;k++){let c=pick(srcs);const seen=new Set();
    for(let s=0;s<40;s++){if(isW(c))break;T(c).river=true;seen.add(c);const nb=NB4[c].filter(j=>!seen.has(j));if(!nb.length)break;
      const wtr=nb.find(j=>isW(j));if(wtr!=null)break;nb.sort((a,b)=>T(a).el-T(b).el);c=Math.random()<.75?nb[0]:pick(nb)}}
  for(let i=0;i<N;i++){if(Math.random()<.08){const ok=Object.keys(RES).filter(r=>RES[r].on.includes(T(i).t));if(ok.length)T(i).res=pick(ok)}}
}
function landmasses(){const lab=new Int32Array(G.w*G.h).fill(-1);let n=0;const sizes=[];
  for(let i=0;i<G.w*G.h;i++){if(isW(i)||lab[i]>=0)continue;const q=[i];lab[i]=n;let s=0;while(q.length){const c=q.pop();s++;for(const j of NB8[c])if(!isW(j)&&lab[j]<0){lab[j]=n;q.push(j)}}sizes.push(s);n++}

/* ================= nieuw spel ================= */
function newGame(size,playerIdx){
  const cfg=SIZES[size];OCC=new Map();
  G={size,w:cfg.w,h:cfg.h,turn:0,tiles:[],units:[],cities:[],uid:1,cid:1,civs:[],rel:[],met:[],wonders:{},player:playerIdx??0,log:[],explored:[],over:false,cityNames:{}};
  genMap(cfg.w,cfg.h);
  const{lab,sizes}=landmasses();const big=sizes.indexOf(Math.max(...sizes));
  let cands=G.tiles.map((t,i)=>i).filter(i=>(T(i).t==='gras'||T(i).t==='vlakte'||T(i).t==='heuvels')&&!isW(i));
  cands.sort((a,b)=>(lab[b]===big)-(lab[a]===big)||siteScore(b,-1)-siteScore(a,-1));
  const starts=[];let md=Math.floor(Math.min(cfg.w,cfg.h)/3);
  while(starts.length<cfg.n&&md>2){for(const c of cands){if(starts.length>=cfg.n)break;if(starts.every(s=>cheb(s,c)>=md))starts.push(c)}if(starts.length<cfg.n){md--;starts.length=0}}
  if(starts.length<cfg.n)return newGame(size,playerIdx);
  const order=[...CIVS.keys()].sort(()=>Math.random()-.5).slice(0,cfg.n);
  if(playerIdx!=null&&!order.includes(playerIdx))order[0]=playerIdx;
  order.forEach((ci,k)=>{const d=CIVS[ci];G.civs.push({id:k,def:ci,name:d.name,color:d.color,ai:true,alive:true,gold:10,beakers:0,research:null,techs:[],tax:.6,nameIdx:0,capital:-1,warTurn:{}});G.cityNames[k]=d.cities})
  G.rel=G.civs.map(()=>G.civs.map(()=>'peace'));G.met=G.civs.map((c,a)=>G.civs.map((d,b)=>a===b));
  G.explored=new Array(cfg.w*cfg.h).fill(0);
  G.civs.forEach((c,k)=>{for(const t of['kolonist','arbeider','krijger','verkenner'])makeUnit(k,t,starts[k])});
  G.player=playerIdx!=null?order.indexOf(playerIdx):0;
  G.civs[G.player].ai=false;
  rebuildOcc();
}
function makeUnit(civ,type,i,vet){const u={id:G.uid++,civ,type,i,hp:vet?4:3,vet:!!vet,mp:UT[type].m*3,fort:false,goto:null,auto:false,work:null,skip:false,onboard:null};G.units.push(u);occAdd(u);return u}

const inv=(...ids)=>ids.includes(G.player);
function yearStr(t=G.turn){let y=t<100?-4000+40*t:t<200?(t-100)*15:1500+(t-200)*5;return y<0?`${-y} v.Chr.`:`${y} n.Chr.`}

/* ================= opbrengsten en steden ================= */
function tileYield(i,c){
  const t=T(i),tt=TER[t.t];let f=tt.f,s=tt.s,cm=tt.c;
  if(t.res){const r=RES[t.res];f+=r.f||0;s+=r.s||0;cm+=r.c||0}
  if(!tt.w&&t.river)cm+=1;
  const isCity=t.city>=0;
  if((t.road||isCity)&&tt.road)cm+=1;
  if((t.irr||(isCity&&tt.irr))&&tt.irr)f+=1;
  if(t.mine&&tt.mine)s+=tt.mine;
  if(isCity){s=Math.max(s,1);f=Math.max(f,1)}
  if(c&&tt.w){if(has(c,'haven'))f+=1;if(cityHasWonder(c,'reus'))cm+=1}
  return{f,s,c:cm}}
function workable(c){const r=[];for(const j of area(c.i,2,true)){if(j===c.i)continue;const t=T(j);if(t.owner!==c.civ||t.city>=0)continue;if(at(j).some(u=>u.civ!==c.civ))continue;r.push(j)}return r}
function assignAll(){const used=new Set();for(const c of G.cities){const cand=workable(c).filter(j=>!used.has(j));const wf=c.pop<6?3:2.2;
  cand.sort((a,b)=>{const A=tileYield(a,c),B=tileYield(b,c);return(B.f*wf+B.s*2+B.c*1.3)-(A.f*wf+A.s*2+A.c*1.3)});
  c.worked=cand.slice(0,c.pop);
  let food=[c.i,...c.worked].reduce((s,j)=>s+tileYield(j,c).f,0)-c.pop*2;
  if(food<0){const rest=cand.slice(c.pop).sort((a,b)=>tileYield(b,c).f-tileYield(a,c).f);
    for(let k=c.worked.length-1;k>=0&&food<0&&rest.length;k--){const nf=tileYield(rest[0],c).f,of=tileYield(c.worked[k],c).f;if(nf>of){food+=nf-of;c.worked[k]=rest.shift()}}}
  c.worked.forEach(j=>used.add(j))}}
function cityYield(c){
  const civ=G.civs[c.civ];let f=0,s=0,cm=0;
  for(const j of[c.i,...c.worked]){const y=tileYield(j,c);f+=y.f;s+=y.s;cm+=y.c}
  const sm=1+(has(c,'bibliotheek')?.5:0)+(has(c,'universiteit')?.5:0)+(cityHasWonder(c,'sterrenwacht')?1:0);
  const gm=1+(has(c,'markt')?.5:0)+(has(c,'bank')?.5:0);
  const sci=Math.round(cm*civ.tax*sm),gold=Math.round(cm*(1-civ.tax)*gm);
  const content=4+(has(c,'tempel')?2:0)+(has(c,'kathedraal')?3:0)+(has(c,'markt')?1:0)+(civHasWonder(c.civ,'tuinen')?1:0);
  const martial=Math.min(3,at(c.i).filter(u=>u.civ===c.civ&&isMil(u)).length);
  const unhappy=Math.max(0,c.pop-content-martial);
  return{f,s,c:cm,sci,gold,unhappy,net:f-c.pop*2}}
const foodBox=p=>10+p*8;
const cultureOf=c=>c.bld.reduce((s,b)=>s+(BT[b].cu||0),0)+Object.keys(G.wonders).filter(k=>G.wonders[k]===c.id).length*3;
function borderR(c){return c.culture<10?1:c.culture<100?2:3}
function updateBorders(){
  const best=new Array(G.w*G.h).fill(null);
  for(const c of G.cities){const r=borderR(c);for(const j of area(c.i,r,true)){const d=cheb(j,c.i),sc=d*1000-c.culture;if(!best[j]||sc<best[j].sc)best[j]={sc,civ:c.civ}}}
  for(let i=0;i<G.w*G.h;i++){const t=T(i);t.owner=t.city>=0?cityById(t.city).civ:best[i]?best[i].civ:-1}
  assignAll();
}
function canFound(i,civ){if(isW(i)||T(i).city>=0)return false;if(T(i).owner>=0&&T(i).owner!==civ)return false;return!G.cities.some(c=>cheb(c.i,i)<3)}
function foundCity(civ,i){
  const C=G.civs[civ],names=G.cityNames[civ];const name=C.nameIdx<names.length?names[C.nameIdx]:names[C.nameIdx%names.length]+' '+(Math.floor(C.nameIdx/names.length)+1);C.nameIdx++;
  const c={id:G.cid++,name,civ,i,pop:1,food:0,prod:0,build:null,bld:[],culture:0,worked:[],disorder:false,founded:G.turn,orig:civ};
  G.cities.push(c);T(i).city=c.id;T(i).road=true;T(i).mine=false;if(C.capital<0)C.capital=c.id;
  updateBorders();c.build=C.ai?aiChooseBuild(c):{k:'u',id:bestDefender(C)};
  if(inv(civ))log(`${name} is gesticht.`);return c}
function bldAvail(c,b){const civ=G.civs[c.civ];if(has(c,b)||!knows(civ,BT[b].t))return false;if(BT[b].coast&&!NB8[c.i].some(isW))return false;return true}
function wonderAvail(c,k){return wonderOwner(k)<0&&knows(G.civs[c.civ],WT[k].t)}
function unitAvail(c,u){const civ=G.civs[c.civ];if(!knows(civ,UT[u].t))return false;if(UT[u].sea&&!NB8[c.i].some(isW))return false;const x=obsolete(civ,u);return!x}
function obsolete(civ,u){const up={krijger:'speerman',speerman:'pikenier',pikenier:'musketier',boog:'zwaard',ruiter:'ridder',ridder:'cavalerie',katapult:'kanon',galei:'karveel'};const n=up[u];return n&&knows(civ,UT[n].t)}
function bestDefender(civ){return Object.keys(UT).filter(k=>isMil({type:k})&&knows(civ,UT[k].t)).sort((a,b)=>UT[b].d-UT[a].d||UT[a].c-UT[b].c)[0]}
function bestAttacker(civ){return Object.keys(UT).filter(k=>isMil({type:k})&&knows(civ,UT[k].t)).sort((a,b)=>(UT[b].a*(1+UT[b].m*.15))-(UT[a].a*(1+UT[a].m*.15))||UT[a].c-UT[b].c)[0]}
function buildCost(b){return b.k==='u'?UT[b.id].c:b.k==='b'?BT[b.id].c:WT[b.id].c}
function buildName(b){return b?b.k==='u'?UT[b.id].n:b.k==='b'?BT[b.id].n:WT[b.id].n:'niets'}
function cityTurn(c){
  const civ=G.civs[c.civ],y=cityYield(c);
  c.disorder=y.unhappy*2>c.pop;
  if(c.disorder){if(inv(c.civ))log(`Onrust in ${c.name}! Bouw een tempel of zet troepen in de stad.`,true);return}
  c.food+=y.net;const box=foodBox(c.pop);
  if(c.food>=box){if(c.pop<8||has(c,'aquaduct')){c.pop++;c.food=has(c,'graanschuur')?Math.floor(box/2):0}else c.food=box}
  else if(c.food<0){if(c.pop>1){c.pop--;if(inv(c.civ))log(`Hongersnood in ${c.name}.`,true)}c.food=0}

    if(c.build.k==='b'&&has(c,c.build.id)){c.build=civ.ai?aiChooseBuild(c):null;return}

      if(c.build.k==='u'){if(UT[c.build.id].settle&&c.pop<2)return;makeUnit(c.civ,c.build.id,c.i,has(c,'kazerne')&&isMil({type:c.build.id}));if(UT[c.build.id].settle)c.pop--;
        c.prod-=cost;if(civ.ai)c.build=aiChooseBuild(c)}
      else if(c.build.k==='b'){c.bld.push(c.build.id);c.prod-=cost;if(inv(c.civ))log(`${c.name} heeft ${BT[c.build.id].n} gebouwd.`,true);c.build=civ.ai?aiChooseBuild(c):null}
      else{G.wonders[c.build.id]=c.id;c.prod-=cost;log(`${civ.name} voltooit ${WT[c.build.id].n} in ${c.name}!`,true);
        if(c.build.id==='academie'){const av=availTechs(civ);if(av.length)learn(civ,pick(av))}
        if(c.build.id==='expo'){endGame(c.civ===G.player,c.civ===G.player?'Je rijk heeft de Wereldtentoonstelling voltooid.':`${civ.name} heeft de Wereldtentoonstelling voltooid.`)}

function techCost(civ){return Math.round(24*Math.pow(1+.5*civ.techs.length,1.35))}

}

/* ================= beweging en gevecht ================= */
function cargo(s){return G.units.filter(x=>x.onboard===s.id)}
function moveCost(u,a,b){if(UT[u.type].sea)return 3;const ta=T(a),tb=T(b);if((ta.road||ta.city>=0)&&(tb.road||tb.city>=0))return 1;return(TER[tb.t].mc||1)*3}
function canEnter(u,j,attack){
  const t=T(j),ut=UT[u.type],w=!!TER[t.t].w;
  const city=t.city>=0?cityById(t.city):null;
  if(ut.sea){if(!w&&!(city&&city.civ===u.civ))return false}
  else if(w){const ship=at(j).find(s=>s.civ===u.civ&&UT[s.type].sea&&cargo(s).length<UT[s.type].cap);if(!ship)return false}
  const others=at(j).filter(o=>o.civ!==u.civ);
  if(others.length)return!!attack&&atWar(u.civ,others[0].civ)&&!ut.civil&&ut.a>0&&(!!ut.sea===w);
  if(city&&city.civ!==u.civ)return!!attack&&atWar(u.civ,city.civ)&&!ut.civil&&!ut.sea;
  if(t.owner>=0&&t.owner!==u.civ&&!atWar(u.civ,t.owner))return false;
  return true}
function setPos(u,j){occDel(u);u.i=j;occAdd(u)}
function moveUnit(u,j){

  else{if(isW(j)){const ship=at(j).find(s=>s.civ===u.civ&&UT[s.type].sea&&cargo(s).length<UT[s.type].cap);u.onboard=ship?ship.id:null}else u.onboard=null;setPos(u,j)}

function sight(u){return UT[u.type].sight||(T(u.i).t==='heuvels'||T(u.i).t==='bergen'?2:1)}

function meetAround(civ,i){for(const j of area(i,2,false)){for(const o of at(j))if(o.civ!==civ)meet(civ,o.civ);const c=cityAt(j);if(c&&c.civ!==civ)meet(civ,c.civ)}}
function meet(a,b){if(G.met[a][b])return;G.met[a][b]=G.met[b][a]=true;if(inv(a,b))log(`Eerste contact met ${G.civs[a===G.player?b:a].name}.`,true)}
function strength(u,role,tile,vsLand){const ut=UT[u.type];let s=role==='a'?ut.a:ut.d;
  if(role==='d'){const t=T(tile);let m=1+(TER[t.t].def||0);if(t.river)m+=.25;if(u.fort)m+=.25;
    const c=cityAt(tile);if(c){m+=.5;if(vsLand&&(has(c,'muren')||civHasWonder(c.civ,'wachtmuur')))m+=1}s*=m}
  return Math.max(s,.1)}
function bestDef(list,tile,vsLand){return list.slice().sort((a,b)=>strength(b,'d',tile,vsLand)*b.hp-strength(a,'d',tile,vsLand)*a.hp)[0]}
function winProb(a,d,tile){const A=strength(a,'a',tile),D=strength(d,'d',tile,!UT[a.type].sea),p=A/(A+D),m={};
  const f=(x,y)=>{if(y<=0)return 1;if(x<=0)return 0;const k=x*10+y;if(k in m)return m[k];return m[k]=p*f(x,y-1)+(1-p)*f(x-1,y)};return f(a.hp,d.hp)}

  while(a.hp>0&&d.hp>0){if(Math.random()<p)d.hp--;else a.hp--}
  const win=a.hp>0,W=win?a:d,Lo=win?d:a;
  if(!W.vet&&Math.random()<.3){W.vet=true;W.hp++}
  if(inv(a.civ,d.civ)){const mine=W.civ===G.player;log(`${UT[a.type].n} (${G.civs[a.civ].name}) valt ${UT[d.type].n} (${G.civs[d.civ].name}) aan: ${mine?'gewonnen':'verloren'}.`,true)}
  killUnit(Lo);return win}
function captureCity(c,civ){

  for(const u of at(c.i).filter(u=>u.civ===prev))killUnit(u);
  if(c.pop<1){log(`${c.name} is verwoest.`,true);T(c.i).city=-1;G.cities=G.cities.filter(x=>x!==c);for(const k in G.wonders)if(G.wonders[k]===c.id)G.wonders[k]=-2}

  const P=G.civs[prev];if(P.capital===c.id){const cs=civCities(prev).sort((a,b)=>b.pop-a.pop);P.capital=cs.length?cs[0].id:-1}

function checkAlive(id){const c=G.civs[id];if(!c.alive)return;if(civCities(id).length||G.units.some(u=>u.civ===id&&UT[u.type].settle))return;
  c.alive=false;for(const u of G.units.filter(u=>u.civ===id))killUnit(u);log(`${c.name} is van de kaart geveegd.`,true);if(id===G.player)endGame(false,'Je rijk is ten onder gegaan.')}
function tryMove(u,j){
  if(u.mp<=0||!NB8[u.i].includes(j))return false;
  const ut=UT[u.type],t=T(j),w=!!TER[t.t].w,city=cityAt(j),enemies=at(j).filter(o=>o.civ!==u.civ),hostileCity=city&&city.civ!==u.civ;
  if(enemies.length||hostileCity){
    const ec=enemies.length?enemies[0].civ:city.civ;
    if(!atWar(u.civ,ec)){if(u.civ===G.player)toast(`Je bent niet in oorlog met ${G.civs[ec].name}.`);return false}
    if(ut.civil||ut.a===0){if(u.civ===G.player)toast('Deze eenheid kan niet aanvallen.');return false}
    if(!!ut.sea!==w){if(u.civ===G.player)toast(ut.sea?'Schepen vallen alleen eenheden op zee aan.':'Landeenheden kunnen niet op zee aanvallen.');return false}
    const fighters=enemies.filter(o=>UT[o.type].d>0||UT[o.type].a>0);

class Heap{constructor(){this.a=[]}get size(){return this.a.length}push(v,p){const a=this.a;a.push([v,p]);let i=a.length-1;while(i>0){const q=(i-1)>>1;if(a[q][1]<=a[i][1])break;[a[q],a[i]]=[a[i],a[q]];i=q}}

function dij(u,target,maxCost=1e9,attackOK=false){

    for(const j of NB8[c]){if(!canEnter(u,j,attackOK&&j===target))continue;const nd=d+moveCost(u,c,j);if(nd<dist[j]){dist[j]=nd;par[j]=c;h.push(j,nd)}}}

  const byTile=new Map();for(const u of G.units)if(u.work){if(!byTile.has(u.i))byTile.set(u.i,[]);byTile.get(u.i).push(u)}
  for(const[i,ws]of byTile){const t=T(i);for(const u of ws){if(!t.job||t.job.task!==u.work){u.work=null;continue}t.job.left--}
    if(t.job&&t.job.left<=0){const k=t.job.task;if(k==='road')t.road=true;if(k==='irr'){t.irr=true;t.mine=false}if(k==='mine'){t.mine=true;t.irr=false}t.job=null;ws.forEach(u=>u.work=null)}}
}

function endTurn(){
  if(G.over)return;
  for(const civ of G.civs)if(civ.alive&&civ.ai)aiTurn(civ);
  workTurn();
  for(const c of G.cities.slice())cityTurn(c);
  for(const civ of G.civs)if(civ.alive)civTurn(civ);
  updateBorders();
  for(const u of G.units){const ut=UT[u.type];const c=cityAt(u.i);
    if(u.mp===ut.m*3||u.fort){if(u.hp<maxHp(u))u.hp=Math.min(maxHp(u),u.hp+(c&&has(c,'kazerne')?maxHp(u):c?2:1))}
    u.mp=ut.m*3;u.skip=false}
  G.turn++;
  for(const u of G.units)meetAround(u.civ,u.i);
  for(const civ of G.civs)if(civ.alive){for(const c of civCities(civ.id))meetAround(civ.id,c.i)}
  G.civs.forEach(c=>checkAlive(c.id));
  if(!G.over)checkVictory();
  if(!G.over)playerAutos();
}
function score(id){const cs=civCities(id);return cs.reduce((s,c)=>s+c.pop,0)+G.civs[id].techs.length*2+Object.values(G.wonders).filter(w=>cityById(w)&&cityById(w).civ===id).length*5+Math.floor(cs.reduce((s,c)=>s+c.culture,0)/50)}
function checkVictory(){
  const rivals=G.civs.filter(c=>c.alive&&c.id!==G.player);
  if(!rivals.length)return endGame(true,'Alle andere rijken zijn veroverd.');
  if(G.turn>=300){const ranks=G.civs.filter(c=>c.alive).sort((a,b)=>score(b.id)-score(a.id));const win=ranks[0].id===G.player;
    endGame(win,win?`Het jaar ${yearStr()} is aangebroken en jouw rijk heeft de hoogste score.`:`Het jaar ${yearStr()} is aangebroken. ${ranks[0].name} heeft de hoogste score.`)}
}

function drawCity(c,x,y){const col=G.civs[c.civ].color,n=Math.min(6,2+Math.ceil(c.pop/2));

    ctx.fillStyle='#d8c8a2';ctx.fillRect(hx-5,hy-6,10,7);ctx.fillStyle='#b5a27a';ctx.fillRect(hx,hy-6,5,7);
    ctx.beginPath();ctx.moveTo(hx-6,hy-6);ctx.lineTo(hx,hy-12);ctx.lineTo(hx+6,hy-6);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=.8;ctx.stroke()}
  if(G.civs[c.civ].capital===c.id){ctx.fillStyle='#5a4630';ctx.fillRect(x-1,y-26,2,14);ctx.fillStyle=col;ctx.fillRect(x+1,y-26,9,6)}}
function cityLabel(c,x,y){ctx.font="700 11px 'Alegreya Sans',sans-serif";const nm=c.name,w=ctx.measureText(nm).width+26,ly=y+TH*.42;

function drawUnits(us,x,y){

let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),3000)}

function unitPanel(u){

  const st=u.work?`Bezig: ${({road:'weg',irr:'irrigatie',mine:'mijn'})[u.work]} (${t.job?t.job.left:'?'} beurten)`:u.fort?'Versterkt':u.auto==='explore'?'Verkent automatisch':u.auto?'Werkt automatisch':u.goto!=null?'Onderweg':u.onboard!=null?'Aan boord':'';

  for(const k of availTechs(civ)){const un=[...Object.keys(UT).filter(u=>UT[u].t===k).map(u=>UT[u].n),...Object.keys(BT).filter(b=>BT[b].t===k).map(b=>BT[b].n),...Object.keys(WT).filter(w=>WT[w].t===k).map(w=>'🏛️ '+WT[w].n)];
    h+=`<div class="row"><div class="grow"><b>${TT[k].n}</b><div class="hint">${un.length?'Levert: '+un.join(', '):'Opstap naar latere technologie'}</div></div><button class="act ${civ.research===k?'on':''}" data-a="research" data-v="${k}">${civ.research===k?'Bezig':'Kies'}</button></div>`}
  if(civ.techs.length)h+=`<h3>Bekend</h3><p class="hint">${civ.techs.map(k=>TT[k].n).join(', ')}</p>`;
  return h}
function pEmpire(){
  const civ=G.civs[G.player],t=totals(G.player),cs=civCities(G.player);
  let h=`<div class="row"><div class="grow">Beurt ${G.turn} van 300 · ${yearStr()}<div class="hint">Score ${score(G.player)} · ${cs.length} steden · ${G.units.filter(u=>u.civ===G.player).length} eenheden</div></div></div>`;
  h+=`<div class="row"><div class="grow">Inkomsten 💰${t.gold}, onderhoud 💰${t.up}, netto ${t.net>=0?'+':''}${t.net} per beurt</div></div><h3>Steden</h3>`;
  for(const c of cs){const y=cityYield(c);h+=`<div class="row"><div class="grow"><b>${c.name}</b> (${c.pop})${c.disorder?' · onrust':''}<div class="hint">${c.build?`${buildName(c.build)}, ${turnsTo(buildCost(c.build)-c.prod,y.s)} beurten`:'<b>Geen productie gekozen</b>'}</div></div><button class="act alt" data-a="opencity" data-v="${c.id}">Open</button></div>`}
  h+=`<h3>Overwinning</h3><p class="hint">Verover alle andere rijken, voltooi de Wereldtentoonstelling (vereist Industrialisatie), of heb de hoogste score in beurt 300.</p>`;
  return h}
function pDiplo(){
  let h='';for(const o of G.civs){if(o.id===G.player||!o.alive)continue;
    if(!G.met[G.player][o.id]){h+=`<div class="row"><div class="grow hint">Onbekend rijk</div></div>`;continue}
    const war=atWar(G.player,o.id);
    h+=`<div class="row"><div class="grow"><span class="sw" style="background:${o.color}"></span><b>${o.name}</b><span class="tag ${war?'war':'peace'}">${war?'Oorlog':'Vrede'}</span><div class="hint">${civCities(o.id).length} steden · score ${score(o.id)} · leger ${Math.round(milPower(o.id))} (jij ${Math.round(milPower(G.player))})</div></div>
    ${war?`<button class="act alt" data-a="peace" data-v="${o.id}">Vrede voorstellen</button>`:`<button class="act war" data-a="war" data-v="${o.id}">Oorlog verklaren</button>`}</div>`}
  h+=`<h3>Gebeurtenissen</h3>`+(G.log.slice(0,14).map(l=>`<div class="hint">${yearStr(l.t)}: ${l.m}</div>`).join('')||'<p class="hint">Nog niets gebeurd.</p>');
  return h}
function renderPanel(){if(!G||G.player<0){$('#panel').innerHTML='';return}
  $('#panel').innerHTML={info:pInfo,stad:pCity,onderzoek:pResearch,rijk:pEmpire,diplo:pDiplo}[tab]()}
function render(){draw();renderTop();renderPanel()}
function syncTabs(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
function openCity(c){viewCity=c.id;chooseOpen=false;tab='stad';syncTabs();render()}
function act(a,v){
  const civ=G.civs[G.player],u=sel;
  if(a==='found'&&u&&canFound(u.i,G.player)){const c=foundCity(G.player,u.i);killUnit(u);sel=null;viewCity=c.id;chooseOpen=true;tab='stad';syncTabs();render();return}
  if((a==='road'||a==='irr'||a==='mine')&&u){startWork(u,a);selectNext();return}
  if(a==='autow'&&u){u.auto=true;aiWorker(u);selectNext();return}
  if(a==='fort'&&u){u.fort=true;u.goto=null;selectNext();return}
  if(a==='explore'&&u){u.auto='explore';const t=exploreTarget(u);if(t>=0){u.goto=t;execGoto(u);u.goto=null}selectNext();return}
  if(a==='skip'&&u){u.skip=true;selectNext();return}
  if(a==='stop'&&u){u.goto=null;u.auto=false;u.work=null;u.fort=false}
  if(a==='disband'&&u){if(pendingDisband!==u.id){pendingDisband=u.id;renderPanel();return}killUnit(u);pendingDisband=null;selectNext();return}
  if(a==='opencity'){openCity(cityById(+v));return}
  if(a==='citylist'){viewCity=null}
  if(a==='choose'){const c=cityById(viewCity);chooseOpen=!(chooseOpen||!c.build)}
  if(a==='setbuild'){const c=cityById(viewCity),[k,id]=v.split(':');if(c.build&&c.build.k!==k)c.prod=Math.floor(c.prod*.5);c.build={k,id};chooseOpen=false}
  if(a==='buy'){const c=cityById(viewCity),cost=buildCost(c.build),b=Math.max(0,(cost-c.prod)*(c.build.k==='w'?4:2)+(c.prod===0?cost-c.prod:0));if(civ.gold>=b){civ.gold-=b;c.prod=cost;toast(`${buildName(c.build)} is gekocht en is volgende beurt klaar.`)}}
  if(a==='selunit'){const x=G.units.find(x=>x.id===+v);if(x){select(x,true);return}}
  if(a==='tax')civ.tax=+v;
  if(a==='research'){if(civ.research!==v){civ.research=v}}
  if(a==='war'){declareWar(G.player,+v)}
  if(a==='peace'){const o=G.civs[+v];const lost=civCities(o.id).filter(c=>c.orig===o.id).length<civCities(o.id).length||milPower(o.id)<milPower(G.player)*.8;
    if(G.turn-(civ.warTurn[o.id]||0)<8)toast(`${o.name} wil nog geen vrede: de oorlog is net begonnen.`);
    else if(lost||Math.random()<.35)makePeace(G.player,o.id);else{toast(`${o.name} weigert vrede.`);civ.warTurn[o.id]=G.turn-4}}
  render()}
function onTap(i){
  if(!G||G.over)return;const mine=at(i).filter(u=>u.civ===G.player),c=cityAt(i);pendingDisband=null;
  if(sel&&G.units.includes(sel)&&sel.i!==i){
    if(NB8[sel.i].includes(i)){sel.goto=null;if(tryMove(sel,i)){afterAction();return}if(!mine.length&&!(c&&c.civ===G.player)){render();return}}
    else if(!mine.length&&!(c&&c.civ===G.player)){if(!G.explored[i]&&!findPath(sel,i)){toast('Daar kan deze eenheid niet komen.');return}
      const p=findPath(sel,i);if(p){sel.goto=i;sel.fort=false;sel.work=null;sel.auto=false;execGoto(sel);afterAction();return}toast('Daar kan deze eenheid niet komen.');return}}
  if(sel&&sel.i===i){if(mine.length>1){const k=mine.indexOf(sel);select(mine[(k+1)%mine.length]);return}if(c&&c.civ===G.player){sel=null;openCity(c);return}sel=null;render();return}
  if(c&&c.civ===G.player&&(!mine.length||tab==='stad')){sel=null;openCity(c);return}
  if(mine.length){if(c&&c.civ===G.player)viewCity=c.id;select(mine.find(needsOrders)||mine[0]);return}
  sel=null;infoTile=i;tab='info';syncTabs();render()}
function tileAt(sx,sy){const wx=(sx-V.x)/V.z-L.ox,wy=(sy-V.y)/V.z-L.oy;const a=wx/(TW/2),b=wy/(TH/2);const x=Math.round((a+b)/2),y=Math.round((b-a)/2);return inb(x,y)?idx(x,y):-1}
function doEndTurn(){
  if(!G||G.over)return;sel=null;$('#endBtn').disabled=true;
  setTimeout(()=>{endTurn();$('#endBtn').disabled=false;if(G.over){render();return}
    const civ=G.civs[G.player],noBuild=civCities(G.player).find(c=>!c.build);
    toast(`${yearStr()} · beurt ${G.turn}`);
    if(!civ.research&&availTechs(civ).length){tab='onderzoek';syncTabs();render();toast('Kies een nieuw onderzoek.');return}
    if(noBuild){openCity(noBuild);chooseOpen=true;render();toast(`${noBuild.name} wacht op een productieopdracht.`);return}
    selectNext()},30)}
function endGame(win,msg){G.over=true;const o=$('#overlay');if(!o)return;o.classList.remove('hide');
  o.innerHTML=`<div class="card"><h1>${win?'Overwinning':'Nederlaag'}</h1><p>${msg}</p><p class="hint">${yearStr()} · score ${score(G.player)}</p><button class="act gold" data-o="new">Nieuw spel</button></div>`}

/* opslaan */
const store={async set(v){if(window.storage)return window.storage.set(SAVEKEY,v,false);localStorage.setItem(SAVEKEY,v)},async get(){if(window.storage){const r=await window.storage.get(SAVEKEY,false);return r&&r.value}return localStorage.getItem(SAVEKEY)}};
async function saveGame(){try{await store.set(JSON.stringify(G));toast(`Spel opgeslagen (${yearStr()}).`)}catch(e){toast('Opslaan is mislukt. Controleer of je browser opslag toestaat.')}}
async function loadGame(){let raw=null;try{raw=await store.get()}catch(e){}if(!raw){toast('Geen opgeslagen spel gevonden.');return}
  try{G=JSON.parse(raw);buildNB();rebuildOcc();sel=null;viewCity=null;startUI();toast(`Spel geladen: ${G.civs[G.player].name}, ${yearStr()}.`)}catch(e){toast('Het opgeslagen spel kan niet worden geladen.')}}

/* invoer */
const ptrs=new Map();let gest=null;const pos=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,pos(e));
  if(ptrs.size===1){const p=pos(e);gest={moved:false,sx:p.x,sy:p.y,vx:V.x,vy:V.y}}
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];gest={pinch:true,d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:V.z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,vx:V.x,vy:V.y}}});
let raf=0;const req=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})};
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,pos(e));if(!gest)return;
  if(gest.pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const nz=Math.max(.35,Math.min(2.5,gest.z*Math.hypot(a.x-b.x,a.y-b.y)/gest.d)),wx=(gest.mx-gest.vx)/gest.z,wy=(gest.my-gest.vy)/gest.z;V.z=nz;V.x=(a.x+b.x)/2-wx*nz;V.y=(a.y+b.y)/2-wy*nz;clampV();req()}
  else if(!gest.pinch){const p=pos(e),dx=p.x-gest.sx,dy=p.y-gest.sy;if(Math.hypot(dx,dy)>8)gest.moved=true;if(gest.moved){V.x=gest.vx+dx;V.y=gest.vy+dy;clampV();req()}}});
function endPtr(e){const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(had&&gest&&!gest.pinch&&!gest.moved&&ptrs.size===0&&e.type==='pointerup'){const p=pos(e),i=tileAt(p.x,p.y);if(i>=0)onTap(i)}if(ptrs.size===0||gest&&gest.pinch)gest=null}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e),f=e.deltaY<0?1.15:1/1.15,wx=(p.x-V.x)/V.z,wy=(p.y-V.y)/V.z;V.z=Math.max(.35,Math.min(2.5,V.z*f));V.x=p.x-wx*V.z;V.y=p.y-wy*V.z;clampV();draw()},{passive:false});
$('#zoom').addEventListener('click',e=>{const b=e.target.closest('[data-z]');if(!b||!G)return;const z=b.dataset.z;
  if(z==='home'){const t=sel?sel.i:(civCities(G.player)[0]||{}).i;if(t!=null)centerOn(t);draw();return}
  const f=z==='in'?1.35:1/1.35,wx=(L.W/2-V.x)/V.z,wy=(L.H/2-V.y)/V.z;V.z=Math.max(.35,Math.min(2.5,V.z*f));V.x=L.W/2-wx*V.z;V.y=L.H/2-wy*V.z;clampV();draw()});
$('#panel').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.v)});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;tab=b.dataset.t;if(tab==='stad')chooseOpen=false;syncTabs();renderPanel()});
$('#nextBtn').addEventListener('click',()=>{if(G&&!G.over)selectNext()});
$('#endBtn').addEventListener('click',doEndTurn);
window.addEventListener('resize',()=>{if(!G)return;layout();draw()});
$('#menuBtn').addEventListener('click',()=>{if(!G||G.player<0)return;const o=$('#overlay');o.classList.remove('hide');
  o.innerHTML=`<div class="card"><h1>Menu</h1><p>${G.civs[G.player].name} · ${yearStr()} · score ${score(G.player)}</p><button class="act gold" data-o="resume">Verder spelen</button><button class="act alt" data-o="save">Opslaan</button><button class="act alt" data-o="load">Laden</button><button class="act alt" data-o="help">Hoe speel je?</button><button class="act alt" data-o="new">Nieuw spel</button></div>`});
const HELP=`<div class="card"><h1>Hoe speel je?</h1>
<p><b>Steden.</b> Sticht steden met kolonisten. Steden groeien met voedsel, bouwen met productie en leveren handel. Handel wordt verdeeld over wetenschap en goud.</p>
<p><b>Eenheden.</b> Tik een eenheid, tik dan een doel. Aangrenzende vijanden val je zo aan. Versterkte eenheden verdedigen beter, en heuvels, bergen, rivieren en stadsmuren helpen ook.</p>
<p><b>Arbeiders.</b> Wegen geven handel en snellere beweging, irrigatie geeft voedsel (bij water), mijnen geven productie op heuvels en bergen.</p>
<p><b>Tevredenheid.</b> Boven 4 inwoners worden mensen ontevreden. Tempels, markten, kathedralen en troepen in de stad helpen. Bij te veel ontevredenheid ligt de stad stil.</p>
<p><b>Cultuur.</b> Gebouwen en wonderen leveren cultuur, waardoor je grenzen groeien.</p>
<p><b>Zee.</b> Schepen vervoeren landeenheden: zet een eenheid op een schip naast de kust en vaar.</p>
<button class="act gold" data-o="resume">Terug</button></div>`;
function startUI(){$('#overlay').classList.add('hide');const civ=G.civs[G.player];$('#cflag').style.background=civ.color;$('#cname').textContent=civ.name;
  layout();const s=G.units.find(u=>u.civ===G.player);if(s)centerOn(s.i,1.1);tab='info';syncTabs();
  const k=G.units.find(u=>u.civ===G.player&&UT[u.type].settle&&needsOrders(u));if(k)select(k);else selectNext();render()}
function startScreen(){
  const o=$('#overlay');o.classList.remove('hide');
  o.innerHTML=`<div class="card"><h1>Rijken der Eeuwen</h1><p>4000 v.Chr. Je volk heeft net zijn eerste kolonisten. Sticht steden, verken de wereld, onderzoek technologie en bouw een rijk dat de tijd doorstaat.</p>
  <div class="btns" style="margin-bottom:10px">${Object.keys(SIZES).map(k=>`<button class="act ${k===mapSize?'gold':'alt'}" data-o="size" data-v="${k}">${SIZES[k].label} (${SIZES[k].n} rijken)</button>`).join('')}</div>
  ${CIVS.map((c,k)=>`<button class="pick" data-pick="${k}"><span class="sw" style="background:${c.color}"></span><span><b>${c.name}</b>Hoofdstad: ${c.cities[0]}</span></button>`).join('')}
  <div class="btns"><button class="act alt" data-o="load">Opgeslagen spel laden</button><button class="act alt" data-o="help">Hoe speel je?</button></div></div>`}
$('#overlay').addEventListener('click',e=>{const b=e.target.closest('[data-o]');
  if(b){const a=b.dataset.o;if(a==='new')startScreen();if(a==='size'){mapSize=b.dataset.v;startScreen()}if(a==='resume'){if(G&&G.player>=0&&!G.over)$('#overlay').classList.add('hide');else startScreen()}
    if(a==='save')saveGame().then(()=>$('#overlay').classList.add('hide'));if(a==='load')loadGame();if(a==='help')$('#overlay').innerHTML=HELP;return}
  const p=e.target.closest('[data-pick]');if(!p)return;newGame(mapSize,+p.dataset.pick);
  log('Sticht je eerste stad: tik op de kolonist en kies Stad stichten.');startUI()});
startScreen();
</script></body></html>
